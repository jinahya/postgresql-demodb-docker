name: dockerhub-readme

# Syncs README.md to the Docker Hub repository description.
# Needs DOCKERHUB_USERNAME and a DOCKERHUB_TOKEN with read/write/delete scope.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/readme.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub credentials
        if: env.DOCKERHUB_TOKEN == ''
        run: echo "::warning::DOCKERHUB_TOKEN secret is empty or missing; skipping README sync"
      - name: Sync README to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/postgresql-demodb
          short-description: "PostgreSQL with the Postgres Professional demo database (Airlines), loaded on first start"
          readme-filepath: ./README.md
